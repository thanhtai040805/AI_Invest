services:
  # ── Tầng 5: Enterprise Persistence & Storage ───────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: aiinvest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aiinvest"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?Set RABBITMQ_PASS in .env}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  sag-postgres:
    profiles: ["research"]
    image: postgres:16
    ports:
      - "127.0.0.1:${SAG_PG_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: ${SAG_DB_NAME:-aiinvest_sag}
      POSTGRES_USER: ${SAG_DB_USER:-aiinvest_sag}
      POSTGRES_PASSWORD: ${SAG_DB_PASSWORD:-aiinvest_sag_local_only}
    volumes:
      - aiinvest_sag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SAG_DB_USER:-aiinvest_sag} -d ${SAG_DB_NAME:-aiinvest_sag}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  sag-qdrant:
    profiles: ["research"]
    image: qdrant/qdrant:v1.14.1
    mem_limit: 1g
    ports:
      - "127.0.0.1:${SAG_QDRANT_PORT:-16333}:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${SAG_QDRANT_API_KEY:-${SAG_SAG_QDRANT_API_KEY:-}}
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
    volumes:
      - aiinvest_sag_qdrantdata:/qdrant/storage
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  # ── Tầng 4: Stock Research Knowledge Routing RAG Core (SAG) ────
  sag-api:
    profiles: ["research"]
    build:
      context: ./SAG/apps/api
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - SAG_ENVIRONMENT=${SAG_ENVIRONMENT:-dev}
      - SAG_DEBUG=${SAG_DEBUG:-false}
      - SAG_SECRET_KEY=${SAG_SECRET_KEY:-dev-insecure-secret-change-me-in-production-0123456789}
      - SAG_AUTH_MODE=${SAG_AUTH_MODE:-continuum}
      - SAG_BFF_SERVICE_TOKEN=${SAG_BFF_SERVICE_TOKEN:-}
      - SAG_ALLOW_REGISTRATION=${SAG_ALLOW_REGISTRATION:-false}
      - SAG_DATABASE_URL=postgresql+asyncpg://${SAG_DB_USER:-aiinvest_sag}:${SAG_DB_PASSWORD:-aiinvest_sag_local_only}@sag-postgres:5432/${SAG_DB_NAME:-aiinvest_sag}
      - SAG_CORE_DATABASE_URL=${SAG_CORE_DATABASE_URL:-postgresql://postgres:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/aiinvest}
      - SAG_DATA_DIR=/data/engine
      - SAG_UPLOAD_DIR=/data/uploads
      - SAG_SAG_RELATIONAL_PROVIDER=postgres
      - SAG_SAG_VECTOR_PROVIDER=qdrant
      - SAG_SAG_LANGUAGE=${SAG_SAG_LANGUAGE:-vi}
      - SAG_SAG_PG_HOST=sag-postgres
      - SAG_SAG_PG_PORT=5432
      - SAG_SAG_PG_USER=${SAG_DB_USER:-aiinvest_sag}
      - SAG_SAG_PG_PASSWORD=${SAG_DB_PASSWORD:-aiinvest_sag_local_only}
      - SAG_SAG_PG_DATABASE=${SAG_DB_NAME:-aiinvest_sag}
      - SAG_SAG_QDRANT_URL=${SAG_SAG_QDRANT_URL:-http://sag-qdrant:6333}
      - SAG_SAG_QDRANT_API_KEY=${SAG_SAG_QDRANT_API_KEY:-}
      - SAG_SAG_QDRANT_SHARED_COLLECTION=${SAG_SAG_QDRANT_SHARED_COLLECTION:-aiinvest_search_units}
      - SAG_SAG_QDRANT_ON_DISK=${SAG_SAG_QDRANT_ON_DISK:-true}
      - SAG_SAG_QDRANT_SCALAR_QUANTIZATION=${SAG_SAG_QDRANT_SCALAR_QUANTIZATION:-true}
      - SAG_LLM_PROVIDER=${SAG_LLM_PROVIDER:-openai}
      - SAG_LLM_BASE_URL=${SAG_LLM_BASE_URL:-https://api.deepinfra.com/v1/openai}
      - SAG_LLM_MODEL=${SAG_LLM_MODEL:-deepseek-ai/DeepSeek-V4-Flash-0731}
      - SAG_LLM_API_KEY=${SAG_LLM_API_KEY:-${DEEPINFRA_API_KEY:-}}
      - SAG_EMBEDDING_BASE_URL=${SAG_EMBEDDING_BASE_URL:-https://api.deepinfra.com/v1/openai}
      - SAG_EMBEDDING_MODEL=${SAG_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - SAG_EMBEDDING_API_KEY=${SAG_EMBEDDING_API_KEY:-${DEEPINFRA_API_KEY:-}}
      - SAG_EMBEDDING_DIMENSIONS=${SAG_EMBEDDING_DIMENSIONS:-1024}
      - SAG_DECISION_PROVIDER=${SAG_DECISION_PROVIDER:-disabled}
      - SAG_DECISION_MODEL=${SAG_DECISION_MODEL:-Kev-4b}
      - SAG_SILICONFLOW_BASE_URL=${SAG_SILICONFLOW_BASE_URL:-https://api.siliconflow.com/v1}
      - SAG_SILICONFLOW_API_KEY=${SAG_SILICONFLOW_API_KEY:-}
      - SAG_RERANK_PROVIDER=${SAG_RERANK_PROVIDER:-disabled}
      - SAG_RERANK_MODEL=${SAG_RERANK_MODEL:-Qwen/Qwen3-Reranker-0.6B}
      - SAG_RERANK_BASE_URL=${SAG_RERANK_BASE_URL:-}
      - SAG_RERANK_API_KEY=${SAG_RERANK_API_KEY:-}
      - SAG_USER_MEMORY_MODE=${SAG_USER_MEMORY_MODE:-shadow}
      - SAG_USER_MEMORY_QDRANT_COLLECTION=${SAG_USER_MEMORY_QDRANT_COLLECTION:-aiinvest_user_memories}
      - SAG_USER_MEMORY_EXTRACTOR_MODEL=${SAG_USER_MEMORY_EXTRACTOR_MODEL:-}
      - SAG_USER_MEMORY_WORKER_ENABLED=${SAG_USER_MEMORY_WORKER_ENABLED:-true}
      - SAG_USER_MEMORY_DEBOUNCE_SECONDS=${SAG_USER_MEMORY_DEBOUNCE_SECONDS:-8.0}
      - SAG_DOCUMENT_PARSER=${SAG_DOCUMENT_PARSER:-auto}
      - SAG_MINERU_PROVIDER=official
      - SAG_MINERU_BASE_URL=${SAG_MINERU_BASE_URL:-https://mineru.net}
      - SAG_MINERU_OFFICIAL_MODEL=${SAG_MINERU_OFFICIAL_MODEL:-pipeline}
      - SAG_MINERU_PARSE_METHOD=${SAG_MINERU_PARSE_METHOD:-auto}
      - SAG_MINERU_OFFICIAL_API_TOKEN=${SAG_MINERU_OFFICIAL_API_TOKEN:-${SAG_MINERU_API_KEY:-}}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-aiinvest-bctc-prod}
      - R2_TOKEN=${R2_TOKEN:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - SAG_R2_MD_LOCAL_CACHE_DIR=${SAG_R2_MD_LOCAL_CACHE_DIR:-/data/r2-md-cache}
      - SAG_OBJECT_INGEST_ALLOWED_HOSTS=${SAG_OBJECT_INGEST_ALLOWED_HOSTS:-.r2.cloudflarestorage.com}
      - SAG_OBJECT_INGEST_ALLOW_PRIVATE_HOSTS_IN_DEV=${SAG_OBJECT_INGEST_ALLOW_PRIVATE_HOSTS_IN_DEV:-false}
      - SAG_LOCAL_PARSE_WORKERS=${SAG_LOCAL_PARSE_WORKERS:-2}
      - SAG_DOCUMENT_EVENT_EXTRACTION_ENABLED=${SAG_DOCUMENT_EVENT_EXTRACTION_ENABLED:-false}
      - SAG_DOCUMENT_CHUNK_MAX_TOKENS=${SAG_DOCUMENT_CHUNK_MAX_TOKENS:-1000}
      - SAG_DOCUMENT_CHUNK_MODE=${SAG_DOCUMENT_CHUNK_MODE:-standard}
      - SAG_KNOWLEDGE_WORKER_ENABLED=${SAG_KNOWLEDGE_WORKER_ENABLED:-true}
      - SAG_KNOWLEDGE_TREE_REBUILD_ENABLED=${SAG_KNOWLEDGE_TREE_REBUILD_ENABLED:-false}
      - SAG_TIMEZONE=${SAG_TIMEZONE:-Asia/Ho_Chi_Minh}
    volumes:
      - aiinvest_sag_data:/data
    depends_on:
      sag-postgres:
        condition: service_healthy
      sag-qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/system/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  migrate:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    image: aiinvest-backend
    command: ["true"]
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/aiinvest
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Tầng 3: Core Quant Intelligence (AI Engine) ───────────────
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - DNSE_ENABLED=${DNSE_ENABLED:-false}
      - DNSE_API_KEY=${DNSE_API_KEY:-}
      - DNSE_API_SECRET=${DNSE_API_SECRET:-}
      - DNSE_ACCOUNT_NO=${DNSE_ACCOUNT_NO:-}
      - DNSE_BASE_URL=${DNSE_BASE_URL:-https://openapi.dnse.com.vn}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:?Set RABBITMQ_USER in .env}:${RABBITMQ_PASS:?Set RABBITMQ_PASS in .env}@rabbitmq:5672/
      - XKIRO_API_KEY=${XKIRO_API_KEY:-}
      - EVOMAP_API_KEY=${EVOMAP_API_KEY:-}
      - MULTI_AGENT_LLM_PROVIDER=${MULTI_AGENT_LLM_PROVIDER:-deepinfra}
      - DEEPINFRA_API_KEY=${DEEPINFRA_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepinfra.com/v1/openai}
      - MULTI_AGENT_ACCOUNT_ID=${MULTI_AGENT_ACCOUNT_ID:-}
      - PORTFOLIO_AUTOMATION_ENABLED=${PORTFOLIO_AUTOMATION_ENABLED:-false}
      - MULTI_AGENT_MODE=${MULTI_AGENT_MODE:-SHADOW_RUNNER}
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/aiinvest
      - AI_ENGINE_ADMIN_TOKEN=${AI_ENGINE_ADMIN_TOKEN:?Set AI_ENGINE_ADMIN_TOKEN in .env}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-aiinvest-bctc-prod}
      - R2_TEST_BUCKET_NAME=${R2_TEST_BUCKET_NAME:-aiinvest-bctc-test}
      - R2_TOKEN=${R2_TOKEN:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  # ── Tầng 2: Core API Gateway & Service Layer (Backend) ─────────
  backend:
    image: aiinvest-backend
    expose:
      - "3001"
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/aiinvest
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:?Set RABBITMQ_USER in .env}:${RABBITMQ_PASS:?Set RABBITMQ_PASS in .env}@rabbitmq:5672/
      - AI_ENGINE_URL=http://ai-engine:8000
      - AI_ENGINE_ADMIN_TOKEN=${AI_ENGINE_ADMIN_TOKEN:?Set AI_ENGINE_ADMIN_TOKEN in .env}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      - SAG_API_URL=${SAG_API_URL:-http://sag-api:8000}
      - SAG_BFF_SERVICE_TOKEN=${SAG_BFF_SERVICE_TOKEN:-}
      - DNSE_ENABLED=${DNSE_ENABLED:-false}
      - DNSE_REDIS_CHANNEL_PREFIX=${DNSE_REDIS_CHANNEL_PREFIX:-dnse:event}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      - CORS_ORIGIN=${CORS_ORIGIN:?Set CORS_ORIGIN in .env}
      - PORT=3001
      - NODE_ENV=${NODE_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ai-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  # ── Tầng 1: Presentation Tier (Frontend Next.js) ───────────────
  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-/}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-/}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  # ── Zone 1: Public DMZ (Nginx Ingress & SSL Termination) ───────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://localhost/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  aiinvest_sag_pgdata:
  aiinvest_sag_qdrantdata:
  aiinvest_sag_data:
