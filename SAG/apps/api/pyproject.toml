[project]
name = "sag-api"
version = "0.1.0"
description = "SAG v2 financial evidence engine for MOAT/GIL"
readme = { text = "SAG API — FastAPI backend for the financial evidence engine.", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "litellm>=1.92,<2",
    "orjson>=3.11.6,<4",
    "alembic>=1.13",
    "markitdown[pdf]>=0.1.6,<0.2",
    "charset-normalizer>=3.3,<4",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
legacy-sqlite = ["aiosqlite>=0.20"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "anyio>=4.4",
    "ruff>=0.5",
    "aiosqlite>=0.20",
]
desktop = [
    "pyinstaller>=6.16,<7",
]

[project.scripts]
sagctl = "sag_api.cli:main"
sag-worker = "sag_api.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sag_api"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "asyncio: async integration tests",
]
testpaths = [
    "tests/test_document_structure_v2.py",
    "tests/test_financial_v2_service.py",
    "tests/test_postgres_schema_e2e.py",
    "tests/test_runtime_database_config.py",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults
