name: CI

on:
  push:
    branches: [ "main", "master", "feat/*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest black ruff mypy
          if [ -f ai-engine/requirements.txt ]; then pip install -r ai-engine/requirements.txt; fi

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Check formatting with Black
        run: |
          black --check .

      - name: Type check with Mypy
        run: |
          mypy ai-engine/app/core/ --ignore-missing-imports

      - name: Test with pytest
        run: |
          pytest ai-engine/app/
