name: Monorepo CI Pipeline

on:
  push:
    branches: [ "main", "master", "feat/*", "fix/*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-check:
    name: Backend (Node.js & Prisma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: back-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build and backend tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  frontend-check:
    name: Frontend (Next.js 16 Standalone)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: front-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
          NEXT_PUBLIC_SOCKET_URL: http://localhost:3001

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  ai-engine-check:
    name: AI Engine (Python 3.11 & Quant Org)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engine
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-engine/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest ruff
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check app tests/unit --select E9,F63,F7,F82

      - name: Unit Tests
        run: pytest tests/unit

  sag-api-check:
    name: SAG Research (advisory while production hold is active)
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SAG/apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip hatchling ruff pytest
          pip install -e ".[dev,postgres]"

      - name: Lint with Ruff
        run: ruff check sag_api sag_agent

  docker-compose-validate:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose --env-file .env.example config -q
