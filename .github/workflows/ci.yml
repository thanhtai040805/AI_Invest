name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and critical tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: back-end/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: node --test tests/*.test.cjs
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_PUBLIC_SOCKET_URL: /
          NEXT_PUBLIC_WS_URL: /
      - run: npm audit --omit=dev --audit-level=high

  ai-engine:
    name: AI Engine build checks and critical tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-engine/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install ruff pytest -r requirements.txt
      - run: ruff check app tests/unit --select E9,F63,F7,F82
      # Beneish M-score cases query financial statements from a seeded local DB.
      - run: >-
          python -m pytest -q
          tests/unit/test_shadow_fill.py
          tests/unit/test_trade_execution_no_mock_fill.py
          tests/unit/test_mathematical_integrity.py
          tests/unit/test_portfolio_eod_and_quotes.py
          tests/unit/test_replay_ml_execution.py
          -k "not TestDualEngineBeneishMScore"

  compose:
    name: Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config -q
      - run: AIINVEST_IMAGE_TAG=ci docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.prod-vps.yml config -q

  publish-images:
    name: Build and publish release images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, ai-engine, compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: ./back-end
          push: true
          tags: ghcr.io/thanhtai040805/aiinvest-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and publish AI Engine
        uses: docker/build-push-action@v6
        with:
          context: ./ai-engine
          push: true
          tags: ghcr.io/thanhtai040805/aiinvest-ai-engine:${{ github.sha }}
          cache-from: type=gha,scope=ai-engine
          cache-to: type=gha,mode=max,scope=ai-engine
      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: ./front-end
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            NEXT_PUBLIC_SOCKET_URL=/
            NEXT_PUBLIC_WS_URL=/
          tags: ghcr.io/thanhtai040805/aiinvest-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Build and publish Nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: ghcr.io/thanhtai040805/aiinvest-nginx:${{ github.sha }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx
